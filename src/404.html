<script>
function redirecionarParaComponente() {
  const path = decodeURIComponent(window.location.pathname);

  // 🚫 IGNORA assets (deixa o 404 real aparecer para arquivos)
  if (/\.(mp3|jpe?g|png|svg|gif|webp|ico|css|js|map|pdf|woff2?|ttf|otf)$/i.test(path)) {
    return;
  }

  // 1o segmento da rota, sem barras, em minusculo (dominio custom = raiz "/")
  const seg = path.replace(/^\/+/, '').split('/')[0].toLowerCase();

  // rotas conhecidas -> destino real, case-insensitive
  const rotas = {
    'nossoamor': '/nossoamor/',
    'en': '/en/',
  };

  if (rotas[seg]) {
    console.log('Redirecionando para:', rotas[seg]);
    window.location.replace(rotas[seg]);
  }
  // rota desconhecida: fica na pagina 404 (com o botao "Voltar ao inicio")
}

redirecionarParaComponente();
</script>
</html>
