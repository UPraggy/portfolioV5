name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# precisa de write em contents para empurrar a build pra branch gh-pages
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build   # gera www/ (inclui CNAME, sitemap, /en/, /nossoamor/, assets)

      # publica o conteudo ja buildado direto na branch gh-pages
      - name: Deploy -> gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          publish_branch: gh-pages
          # CNAME ja vem dentro de www/ (copy target), mantem o dominio custom
          cname: rafaelmr.com.br
